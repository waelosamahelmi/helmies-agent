# Helmies Studio — Production Docker Compose
# Services: gateway, landing, studio-web, agent-api, platform-api, worker,
#           director-service, vision-service, mongodb, postgres, redis, meilisearch

version: "3.8"

services:
  # ── Gateway / Reverse Proxy ──
  gateway:
    image: nginx:alpine
    container_name: helmies-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - landing
      - studio-web
      - platform-api
      - agent-api
    restart: unless-stopped
    networks:
      - helmies-net

  # ── Public Landing Page (Next.js) ──
  landing:
    build:
      context: ./apps/landing
      dockerfile: Dockerfile
    container_name: helmies-landing
    env_file:
      - ./apps/landing/.env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_URL=https://studio.helmies.fi
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - helmies-net

  # ── Authenticated Studio Web (Vite + React / LibreChat client) ──
  studio-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: studio-web
    container_name: helmies-studio-web
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    depends_on:
      - agent-api
      - platform-api
    restart: unless-stopped
    networks:
      - helmies-net

  # ── Agent API (LibreChat Express backend) ──
  agent-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: helmies-agent-api
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongodb:27017/HelmiesStudio
      - MEILI_HOST=http://meilisearch:7700
      - REDIS_URI=redis://redis:6379
    depends_on:
      - mongodb
      - redis
      - meilisearch
    restart: unless-stopped
    networks:
      - helmies-net

  # ── Platform API (Commercial backend) ──
  platform-api:
    build:
      context: ./apps/platform-api
      dockerfile: Dockerfile
    container_name: helmies-platform-api
    env_file:
      - ./apps/platform-api/.env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URI=redis://redis:6379
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - helmies-net

  # ── Worker (Media & Workflow Jobs) ──
  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    container_name: helmies-worker
    env_file:
      - ./apps/worker/.env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URI=redis://redis:6379
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      - helmies-net

  # ── Director Service (Clean-room planner) ──
  director-service:
    build:
      context: ./apps/director-service
      dockerfile: Dockerfile
    container_name: helmies-director
    env_file:
      - ./apps/director-service/.env
    depends_on:
      - platform-api
    restart: unless-stopped
    networks:
      - helmies-net

  # ── Vision Service (Image analysis) ──
  vision-service:
    build:
      context: ./apps/vision-service
      dockerfile: Dockerfile
    container_name: helmies-vision
    env_file:
      - ./apps/vision-service/.env
    restart: unless-stopped
    networks:
      - helmies-net

  # ── MongoDB (Agent runtime data) ──
  mongodb:
    image: mongo:8.0.20
    container_name: helmies-mongo
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - helmies-net

  # ── PostgreSQL (Commercial data) ──
  postgres:
    image: postgres:17
    container_name: helmies-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-helmies}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-helmies}
      - POSTGRES_DB=${POSTGRES_DB:-helmies_studio}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - helmies-net

  # ── Redis (Queues, cache, locks) ──
  redis:
    image: redis:7-alpine
    container_name: helmies-redis
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - helmies-net

  # ── Meilisearch (Full-text search) ──
  meilisearch:
    image: getmeili/meilisearch:v1.35.1
    container_name: helmies-meili
    environment:
      - MEILI_NO_ANALYTICS=true
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-helmies-meili-key}
    volumes:
      - meili-data:/meili_data
    restart: unless-stopped
    networks:
      - helmies-net

volumes:
  mongo-data:
  postgres-data:
  redis-data:
  meili-data:

networks:
  helmies-net:
    driver: bridge
